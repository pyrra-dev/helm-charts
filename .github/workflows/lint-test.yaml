---
name: Lint and Test Charts
permissions: {}

on:
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # major and minor need manual adjustments
        include:
          # renovate: docker=kindest/node
          - k8s-version: v1.34.11
          # renovate: docker=kindest/node
          - k8s-version: v1.35.8
          # renovate: docker=kindest/node
          - k8s-version: v1.36.4
          # renovate: docker=kindest/node
          - k8s-version: v1.37.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run helm-unittest
        # helm-unittest does not support Helm v4 yet, so this step uses v3
        # https://github.com/helm-unittest/helm-unittest/issues/777
        uses: d3adb5/helm-unittest-action@985d798b675caa501251573380b5e026ff768c50 # v2.5.1
        with:
          charts: charts/*
          # renovate: github=helm/helm
          helm-version: v4.3.0
          # renovate: github=helm-unittest/helm-unittest
          unittest-version: v1.2.1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: github=helm/helm
          version: v4.3.0

      - name: Set up kubeconform
        run: |
          # renovate: github=yannh/kubeconform
          KUBECONFORM_VERSION=v0.8.0
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Run kubeconform
        run: |
          K8S_VERSION=$(echo "${{ matrix.k8s-version }}" | sed 's|^v||')
          for chart in charts/*/; do
            for values_file in "${chart}"ci/*.yaml; do
              [ -e "$values_file" ] || continue
              helm template test "$chart" -f "$values_file" | kubeconform \
                -kubernetes-version "$K8S_VERSION" \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            done
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # renovate: github=python/cpython
          python-version: '3.14.8'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          # renovate: github=helm/chart-testing
          version: v3.15.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/linters/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_list=\"${changed//$'\n'/ }\"" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/linters/ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.list-changed.outputs.changed == 'true'
        with:
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Apply Gateway API CRDs
        run: |
          kubectl apply -k https://github.com/kubernetes-sigs/gateway-api/config/crd
        if: steps.list-changed.outputs.changed == 'true'

      - name: Apply Prometheus Operator CRDs
        env:
          CHANGED_LIST: ${{ steps.list-changed.outputs.changed_list }}
        run: |
          helm install prometheus-operator-crds oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
        if: steps.list-changed.outputs.changed == 'true'

      - name: Deploy Mimir stub
        run: |
          kubectl apply -f .github/testdata/mimir-stub.yaml
          kubectl --namespace mimir-stub rollout status deployment/mimir-stub --timeout=120s
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: ct install --config .github/linters/ct.yaml

  super-linter:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # post PR summary comment
      pull-requests: write # post PR summary comment
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          LINTER_RULES_PATH: .github/linters
          MULTI_STATUS: false
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSON: true
          VALIDATE_JSONC: true
          VALIDATE_MARKDOWN: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_PYTHON: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_XML: true
