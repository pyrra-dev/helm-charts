suite: grafana-dashboards
templates:
  - templates/grafana-dashboards.yaml
tests:
  - it: should not render dashboards by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render two ConfigMaps when enabled
    set:
      dashboards.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should set the Grafana dashboard label when enabled
    set:
      dashboards.enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - isNotNullOrEmpty:
          path: metadata.labels.grafana_dashboard

  - it: should query the generic rules Pyrra records in the detail dashboard
    set:
      dashboards.enabled: true
    documentSelector:
      path: metadata.name
      value: pyrra-detail
    asserts:
      - matchRegex:
          path: data["pyrra-detail.json"]
          pattern: 'sum\(pyrra_requests:rate5m\{slo=\\"\$slo\\"\}\)'
      - matchRegex:
          path: data["pyrra-detail.json"]
          pattern: 'sum\(pyrra_errors:rate5m\{slo=\\"\$slo\\"\}\)'
      - notMatchRegex:
          path: data["pyrra-detail.json"]
          pattern: 'pyrra_(requests|errors)_total'
